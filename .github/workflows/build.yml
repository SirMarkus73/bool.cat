name: Build & Publish

on:
    workflow_run:
        workflows: [Release]
        types: [completed]
        branches: [main]

permissions:
    contents: read
    packages: write

env:
    # GHCR images must live under the owner namespace and be lowercase
    IMAGE_NAME: ghcr.io/sirmarkus73/bool.cat

jobs:
    build:
        # only build when the release workflow succeeded
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # tag the image with the version bumped by semantic-release
            - name: Read version from package.json
              id: version
              run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

            - name: Build and push Docker images
              uses: iloveitaly/github-action-railpack@master
              with:
                  push: true
                  tags: |
                      ${{ env.IMAGE_NAME }}:latest
                      ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
